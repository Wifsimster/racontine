name: Build & push images (GHCR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Garde-fou : le build TS doit passer avant de publier des images.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    needs: check
    # Les PRs CONSTRUISENT les images, sans les publier.
    #
    # Avant, elles ne les construisaient pas du tout : une PR qui touchait un
    # Dockerfile était donc bâtie pour la PREMIÈRE fois après la fusion — et le
    # déploiement homelab part sur ce même événement. Une erreur de Dockerfile
    # ne se découvrait donc qu'une fois `main` cassé et la production avec.
    # Construire sans publier coûte quelques minutes de runner et supprime
    # entièrement cette fenêtre.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: ./server/Dockerfile
          - name: web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pas de connexion au registre sur une PR : on ne publie rien, et une PR
      # ne doit pas avoir besoin d'un droit d'écriture sur les paquets.
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/racontine-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build (et publication hors PR)
        uses: docker/build-push-action@v6
        with:
          # Contexte à la RACINE, et Dockerfile désigné par paquet : le lockfile
          # du monorepo y vit, et c'est lui qui rend le build reproductible
          # (`--frozen-lockfile`). Avec un contexte par paquet, le lockfile
          # était hors de portée et chaque build reprenait sa propre résolution.
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=racontine-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=racontine-${{ matrix.name }}
