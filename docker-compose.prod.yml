# Déploiement homelab : images tirées de GHCR (aucun build sur le homelab).
#   docker login ghcr.io          # PAT read:packages si les packages sont privés
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Les migrations sont appliquées automatiquement au démarrage du serveur.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-racontine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-racontine}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-racontine}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: ghcr.io/wifsimster/racontine-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-racontine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-racontine}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # `docker logs` grossit sans fin par défaut : sur un homelab, c'est le
    # disque du carnet qui se remplit de ses propres traces. Trois fichiers de
    # 10 Mo suffisent à diagnostiquer un incident récent.
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/wifsimster/racontine-web:latest
    restart: unless-stopped
    ports:
      # À placer derrière le reverse proxy (Traefik/NPM/Caddy) en HTTPS.
      - "8080:80"
    # `service_healthy`, et non le simple `depends_on` d'avant : nginx RÉSOUT
    # `server` au démarrage et REFUSE de démarrer si le nom ne répond pas
    # (« host not found in upstream »). Avec une simple dépendance d'ordre, le
    # front pouvait donc mourir au lancement de la pile et n'être rattrapé que
    # par `restart:` — le temps que le serveur finisse ses migrations.
    depends_on:
      server:
        condition: service_healthy
    logging: *logs

# Le reverse proxy route le domaine public vers web:80 ; nginx (dans l'image web)
# proxie /api/ vers server:3010. Seul `web` a besoin d'être exposé.
#
# Les deux images portent leur propre HEALTHCHECK (voir leurs Dockerfile) :
# `docker compose ps` dit donc si le service RÉPOND, et pas seulement s'il
# tourne — un serveur vivant mais incapable de joindre la base se voyait
# jusqu'ici comme « Up ».
#
# SAUVEGARDE : `./scripts/backup.sh` prend la base ET les photos. Les migrations
# s'appliquent au démarrage du serveur, donc à chaque déploiement : une
# sauvegarde quotidienne hors de cette machine n'est pas un luxe.
