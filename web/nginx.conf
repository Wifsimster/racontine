map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_host $client_host {
    ""      $host;
    default $http_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.battistella.ovh; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://umami.battistella.ovh; manifest-src 'self'; worker-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://server:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 25m;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
    }

    location ~ ^/(sw|push-sw)\.js$ {
        expires -1;
    }

    location = /index.html {
        expires -1;

        sub_filter_once off;
        sub_filter 'content="/og.png"' 'content="$client_proto://$client_host/og.png"';
        sub_filter '<meta property="og:url" content="/" />' '<meta property="og:url" content="$client_proto://$client_host/" />';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
