server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité ────────────────────────────────────────────────
    # Posés ici et pas côté Fastify : ils concernent le DOCUMENT servi au
    # navigateur, et c'est nginx qui le sert. `always` pour qu'ils accompagnent
    # aussi les réponses d'erreur — une page 404 exécute du HTML comme une autre.
    #
    # La CSP est écrite pour CE front, pas copiée d'un modèle :
    #  · `script-src 'self'` — tout le JS est local (aucun CDN, aucune balise
    #    inline) ; c'est la ligne qui rend une injection inexploitable.
    #  · `style-src` accepte l'inline parce que React pose des styles par
    #    attribut `style` (barres de progression, positions calculées) ; Tailwind
    #    est compilé dans un fichier, ce n'est pas lui qui l'exige.
    #  · `img-src` accepte `data:` et `blob:` : l'aperçu d'une photo de carnet
    #    avant envoi est un blob local (voir `photo-store.ts`).
    #  · `connect-src 'self'` — l'app ne parle qu'à sa propre API. La clé
    #    Anthropic est utilisée par le SERVEUR : le navigateur ne doit jamais
    #    joindre api.anthropic.com, et cette ligne le garantit.
    #  · `frame-ancestors 'none'` — le journal d'un enfant ne s'encadre nulle
    #    part. C'est aussi ce qui rend `X-Frame-Options` redondant, gardé pour
    #    les navigateurs qui ignorent encore `frame-ancestors`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # `strict-origin-when-cross-origin` fuiterait encore l'origine vers
    # l'extérieur ; un lien d'invitation partagé ne doit rien dire de l'instance.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # HSTS : c'est le reverse proxy qui termine le TLS, mais l'en-tête doit venir
    # de l'application pour couvrir les sous-domaines. Sans `preload` : on
    # n'inscrit pas le domaine de quelqu'un d'autre sur une liste irréversible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://server:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        # Une lecture de carnet peut tenir quelques minutes côté serveur : le
        # défaut de 60 s coupait la réponse avant elle.
        proxy_read_timeout 300s;
    }

    # Les fichiers versionnés par leur empreinte (dist/assets/index-XXXX.js) ne
    # changent jamais sous le même nom : on les garde un an. `index.html` et le
    # service worker, eux, ne doivent JAMAIS être servis depuis le cache — c'est
    # ce couple qui décide quelle version de l'app tourne.
    #
    # ATTENTION, PIÈGE NGINX : `add_header` dans un `location` ANNULE tous les
    # `add_header` hérités du serveur. Mettre `add_header Cache-Control` ici
    # aurait donc retiré la CSP et les autres en-têtes de sécurité — et
    # précisément sur `index.html`, le seul document qui exécute du script.
    # On passe donc par la directive `expires`, qui écrit `Cache-Control`
    # sans toucher à l'héritage.
    location /assets/ {
        expires 1y;
    }

    location = /sw.js {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
